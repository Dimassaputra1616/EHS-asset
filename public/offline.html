<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - HSE Asset Management</title>
    <style>
        :root {
            --hse-red: #C0392B;
            --hse-red-light: #e74c3c;
            --light-bg: #f9fafb;
            --text-dark: #111827;
            --text-gray: #6b7280;
            --border-light: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .offline-container {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-light);
        }

        .icon-container {
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: rgba(192, 57, 43, 0.08);
            color: var(--hse-red);
            animation: pulse 2s infinite ease-in-out;
        }

        .icon-container svg {
            width: 40px;
            height: 40px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-dark);
        }

        p {
            font-size: 15px;
            color: var(--text-gray);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-retry {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--hse-red) 0%, var(--hse-red-light) 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(192, 57, 43, 0.2);
            text-decoration: none;
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(192, 57, 43, 0.3);
        }

        .btn-retry:active {
            transform: translateY(0);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(192, 57, 43, 0.2);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 10px rgba(192, 57, 43, 0);
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 21v-4.875c0-.621.504-1.125 1.125-1.125h5.25c.621 0 1.125.504 1.125 1.125V21m0 0h4.5V3.545M21 21h1.5M3 21h1.5m1.5 0h-1.5m0 0V10.5m0 10.5h6M21 21h-6M3 10.5h18M3 10.5V6a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 6v4.5m-15 0V6.75A2.25 2.25 0 0 1 8.25 4.5h7.5A2.25 2.25 0 0 1 18 6.75V10.5M6 18H7.5M6 14.5H7.5M6 11H7.5M10.5 18H12M10.5 14.5H12M10.5 11H12m4.5 7H18m-1.5-3.5H18m-1.5-3.5H18" />
            </svg>
        </div>
        <h1>Connection Lost</h1>
        <p>It seems you are currently offline. Please check your internet connection and try reloading the application.</p>
        <button class="btn-retry" onclick="window.location.reload();">Retry Connection</button>
    </div>
</body>
</html>
